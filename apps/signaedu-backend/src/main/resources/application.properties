spring.application.name=signaedu-backend

# Base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/signaedu_db
spring.datasource.username=postgres
spring.datasource.password=1608

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
jwt.secret=clave-secreta-signaedu-desarrollo-cambiar-en-produccion-2024
jwt.expiration-ms=86400000

# Storage de archivos (Fase 2d) — filesystem local en dev.
# Para produccion la Vista Fisica del 4+1 contempla S3; ver ArchivoStorage.
storage.local.root=./uploads