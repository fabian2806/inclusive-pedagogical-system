spring.application.name=signaedu-backend

# Base de datos
# Externalizado para despliegue (Railway / AWS-RDS). Los defaults son el entorno local de dev.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/signaedu_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1608}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Servidor — el host (Railway / contenedor) inyecta PORT; en local cae a 8080.
server.port=${PORT:8080}

# JWT — el secreto se sobreescribe por env en despliegue (OBLIGATORIO en prod). Default solo para dev.
jwt.secret=${JWT_SECRET:clave-secreta-signaedu-desarrollo-cambiar-en-produccion-2024}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS — origenes permitidos del frontend (separados por coma). Default = Vite dev.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Storage de archivos (Fase 2d) — filesystem local en dev.
# Para produccion la Vista Fisica del 4+1 contempla S3; ver ArchivoStorage.
storage.local.root=${STORAGE_LOCAL_ROOT:./uploads}
storage.max-bytes=10485760
storage.allowed-mime-types=application/pdf,image/jpeg,image/png,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet

# Limites de multipart (Fase 2d). El servicio valida contra storage.max-bytes.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
